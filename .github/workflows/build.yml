name: Build APK from ZIP
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Project
      run: |
        mkdir project
        unzip *.zip -d project
        
    - name: Find and Move Project Files
      run: |
        cd project
        inner_dir=$(find . -name package.json -exec dirname {} \; | head -n 1)
        if [ "$inner_dir" != "." ]; then
          mv $inner_dir/* .
          mv $inner_dir/.* . 2>/dev/null || true
        fi
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install and Build
      run: |
        npm install
        npm run build
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Avida" "com.avida.app" --web-dir=dist
        npx cap add android
        npx cap sync android
        
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: avida-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
